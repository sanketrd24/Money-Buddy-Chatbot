<!DOCTYPE html>
<html>
<head>
    <base href="$FLUTTER_BASE_HREF">
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Money Buddy - A friendly financial learning chatbot for beginners">

    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Money Buddy">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"/>

    <title>Money Buddy - Financial Learning Chatbot</title>
    <link rel="manifest" href="manifest.json">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
        }
        #loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #6366F1 0%, #10B981 100%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            flex-direction: column;
            gap: 20px;
            transition: opacity 0.3s ease-out;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .text {
            font-size: 18px;
            font-weight: 500;
        }
    </style>
</head>
<body>
  <div id="loading">
      <div class="spinner"></div>
      <div class="text">Money Buddy is loading...</div>
  </div>
  <script src="flutter.js" defer></script>
  <script>
    function hideLoading() {
      const loadingDiv = document.getElementById('loading');
      if (loadingDiv) {
        loadingDiv.classList.add('hidden');
      }
    }

    window.addEventListener('load', function(ev) {
      const loadingDiv = document.getElementById('loading');
      
      // Set timeout to hide loading screen after 15 seconds (failsafe)
      setTimeout(hideLoading, 15000);
      
      // Initialize Flutter engine
      if (typeof _flutter !== 'undefined') {
        try {
          _flutter.initializeEngine().then(function() {
            hideLoading();
          }).catch(function(error) {
            console.error('Flutter initialization error:', error);
            if (loadingDiv) {
              loadingDiv.innerHTML = '<div style="color: #ff6b6b; text-align: center;"><div>Error loading Money Buddy</div><div style="font-size: 14px; margin-top: 10px;">' + error.toString() + '</div></div>';
            }
          });
          
          // Auto-start after initialization
          _flutter.autoStart();
        } catch (error) {
          console.error('Flutter startup error:', error);
          if (loadingDiv) {
            loadingDiv.innerHTML = '<div style="color: #ff6b6b; text-align: center;"><div>Failed to start Money Buddy</div><div style="font-size: 12px; margin-top: 10px;">Please reload the page</div></div>';
          }
        }
      } else {
        console.error('Flutter engine not available');
        if (loadingDiv) {
          loadingDiv.innerHTML = '<div style="color: #ff6b6b; text-align: center;"><div>Flutter engine not loaded</div><div style="font-size: 12px; margin-top: 10px;">Please check your connection and reload</div></div>';
        }
      }
    });
  </script>
</body>
</html>
