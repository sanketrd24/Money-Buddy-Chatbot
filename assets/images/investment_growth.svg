<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Background -->
  <rect width="400" height="300" fill="#F3F4F6"/>
  
  <!-- Title -->
  <text x="200" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1F2937">Investment Growth</text>
  
  <!-- Grid lines -->
  <line x1="50" y1="250" x2="350" y2="250" stroke="#D1D5DB" stroke-width="2"/>
  <line x1="50" y1="200" x2="350" y2="200" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="50" y1="150" x2="350" y2="150" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="50" y1="100" x2="350" y2="100" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Y-axis -->
  <line x1="50" y1="50" x2="50" y2="250" stroke="#1F2937" stroke-width="2"/>
  
  <!-- X-axis labels -->
  <text x="70" y="270" font-size="12" fill="#6B7280">Year 1</text>
  <text x="150" y="270" font-size="12" fill="#6B7280">Year 5</text>
  <text x="230" y="270" font-size="12" fill="#6B7280">Year 10</text>
  <text x="310" y="270" font-size="12" fill="#6B7280">Year 20</text>
  
  <!-- Y-axis label -->
  <text x="20" y="150" font-size="11" fill="#6B7280" text-anchor="middle">Value</text>
  
  <!-- Growth curve -->
  <polyline points="70,240 150,190 230,120 310,80" fill="none" stroke="#10B981" stroke-width="3"/>
  
  <!-- Data points -->
  <circle cx="70" cy="240" r="5" fill="#10B981"/>
  <circle cx="150" cy="190" r="5" fill="#10B981"/>
  <circle cx="230" cy="120" r="5" fill="#10B981"/>
  <circle cx="310" cy="80" r="5" fill="#10B981"/>
  
  <!-- Labels -->
  <text x="70" y="260" font-size="11" text-anchor="middle" fill="#374151">100 rupees</text>
  <text x="150" y="210" font-size="11" text-anchor="middle" fill="#374151">163 rupees</text>
  <text x="230" y="100" font-size="11" text-anchor="middle" fill="#374151">259 rupees</text>
  <text x="310" y="60" font-size="11" text-anchor="middle" fill="#374151">673 rupees</text>
  
  <!-- Bottom text -->
  <text x="200" y="295" font-size="13" font-weight="bold" text-anchor="middle" fill="#1F2937">Power of Compound Interest</text>
</svg>
