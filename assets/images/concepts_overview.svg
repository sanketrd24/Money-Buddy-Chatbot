<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Background -->
  <rect width="400" height="300" fill="#F3F4F6"/>
  
  <!-- Title -->
  <text x="200" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1F2937">Financial Concepts</text>
  
  <!-- Concept 1: SIP -->
  <rect x="20" y="70" width="80" height="100" fill="#6366F1" rx="10"/>
  <text x="60" y="100" font-size="16" font-weight="bold" text-anchor="middle" fill="white">SIP</text>
  <text x="60" y="125" font-size="11" text-anchor="middle" fill="white">Regular</text>
  <text x="60" y="140" font-size="11" text-anchor="middle" fill="white">Investment</text>
  <text x="60" y="155" font-size="11" text-anchor="middle" fill="white">Plan</text>
  
  <!-- Concept 2: Mutual Fund -->
  <rect x="110" y="70" width="80" height="100" fill="#10B981" rx="10"/>
  <text x="150" y="100" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Mutual</text>
  <text x="150" y="125" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Fund</text>
  <text x="150" y="145" font-size="11" text-anchor="middle" fill="white">Pooled</text>
  <text x="150" y="160" font-size="11" text-anchor="middle" fill="white">Investment</text>
  
  <!-- Concept 3: Risk vs Return -->
  <rect x="200" y="70" width="80" height="100" fill="#F59E0B" rx="10"/>
  <text x="240" y="105" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Risk vs</text>
  <text x="240" y="125" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Return</text>
  <text x="240" y="150" font-size="11" text-anchor="middle" fill="white">Balance</text>
  
  <!-- Concept 4: Diversification -->
  <rect x="290" y="70" width="90" height="100" fill="#EC4899" rx="10"/>
  <text x="335" y="105" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Diversifi-</text>
  <text x="335" y="125" font-size="13" font-weight="bold" text-anchor="middle" fill="white">cation</text>
  <text x="335" y="150" font-size="11" text-anchor="middle" fill="white">Spread</text>
  
  <!-- Bottom message -->
  <text x="200" y="250" font-size="16" text-anchor="middle" fill="#374151">Tap to learn more about each concept</text>
  <text x="200" y="280" font-size="13" text-anchor="middle" fill="#6B7280">Master the fundamentals of investing</text>
</svg>
